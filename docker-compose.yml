name: takenbord

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-database-url: &database-url postgres://takenbord:${POSTGRES_PASSWORD:?Zet POSTGRES_PASSWORD in .env}@db:5432/takenbord

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: takenbord
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Zet POSTGRES_PASSWORD in .env}
      POSTGRES_DB: takenbord
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takenbord -d takenbord"]
      interval: 5s
      timeout: 5s
      retries: 30

  migreer:
    build: { context: ., target: worker }
    image: takenbord-worker
    command: ["npx", "tsx", "src/scripts/migreer.ts"]
    init: true
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    logging: *logging

  app:
    build: { context: ., target: app }
    image: takenbord-app
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: *database-url
      APP_URL: https://${DOMEIN:?Zet DOMEIN in .env}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      NTFY_URL: http://ntfy
      NTFY_PUBLIEKE_URL: https://ntfy.${DOMEIN}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      BIJLAGEN_MAP: /bijlagen
      OPSLAG_CONTROLE: ${OPSLAG_CONTROLE:-0}
    volumes:
      - ${BIJLAGEN_OPSLAG:-bijlagen}:/bijlagen
    depends_on:
      migreer: { condition: service_completed_successfully }

  worker:
    build: { context: ., target: worker }
    image: takenbord-worker
    init: true
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: *database-url
      BACKUP_MAP: /backups
      BIJLAGEN_MAP: /bijlagen
      OPSLAG_CONTROLE: ${OPSLAG_CONTROLE:-0}
      APP_URL: https://${DOMEIN:?Zet DOMEIN in .env}
      NTFY_URL: http://ntfy
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    volumes:
      - ${BACKUP_OPSLAG:-backups}:/backups
      - ${BIJLAGEN_OPSLAG:-bijlagen}:/bijlagen
    depends_on:
      migreer: { condition: service_completed_successfully }

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    command: serve
    restart: unless-stopped
    logging: *logging
    environment:
      NTFY_BASE_URL: https://ntfy.${DOMEIN:?Zet DOMEIN in .env}
      NTFY_BEHIND_PROXY: "true"
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
    volumes:
      - ntfy-data:/var/lib/ntfy

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_POORT:-80}:80"
      - "${HTTPS_POORT:-443}:443"
    environment:
      DOMEIN: ${DOMEIN:?Zet DOMEIN in .env}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app, ntfy]

volumes:
  db-data:
  backups:
  bijlagen:
  ntfy-data:
  caddy-data:
  caddy-config:
